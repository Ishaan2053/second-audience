name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Lock check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv lock --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv run --locked ruff check .

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv run --locked ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv run --locked mypy src

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv run --locked pytest -m "not network"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg SA_GIT_COMMIT=${{ github.sha }} -t second-audience:ci .
      # Start the image with defaults (SQLite, no Flagsmith) and wait for /healthz.
      - run: |
          docker run -d --name sa -p 10000:10000 second-audience:ci
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:10000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs sa
          exit 1

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv export --locked --no-hashes --no-emit-project --format requirements.txt -o requirements-audit.txt
      - run: uvx pip-audit --strict -r requirements-audit.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
