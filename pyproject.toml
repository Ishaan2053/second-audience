[project]
name = "second-audience"
version = "0.1.0"
description = "A/B testing for the interfaces AI agents use, powered by Flagsmith Experimentation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ishaan2053", email = "Ishaan2053@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.6",
    "flagsmith>=6.7.0",
    "google-genai>=3.6.1",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
    "typer>=0.29.3",
    "tzdata>=2026.6",
    "urllib3>=2.8.0",
]

[project.scripts]
sa = "second_audience.operator.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
# Domain errors keep the names the architecture and tickets use (RoomConflict, ...).
"src/second_audience/booking/world.py" = ["N818"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: needs Flagsmith, Gemini or other network access; run locally, not in CI",
]
